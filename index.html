<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phishing Training - HR & Finance Edition</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }
        a {
            display: block;
            margin: 10px;
            padding: 10px;
            background-color: #f2f2f2;
            border: 1px solid #ccc;
            text-decoration: none;
        }
        a:hover {
            background-color: #e6e6e6;
        }
        .alert {
            color: red;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Spot the Phishing Attempt!</h1>
    <p>Choose the correct link for each scenario. If you click the wrong one, you'll see a message.</p>
    
    <h2>Scenario 1: HR Portal Login</h2>
    <a href="https://hr.mycompany-portal.com/login">Correct Link</a>
    <a href="https://mycompany.hr.com/updateinfo" target="_blank">Wrong Link 1</a>
    <a href="https://hr.myc0mpany.com/login" target="_blank">Wrong Link 2 (Phishing!)</a>
    <a href="https://hr.mycompany.com-login.net" target="_blank">Wrong Link 3 (Phishing!)</a>
    
    <div class="alert">
        <h3>If you clicked a phishing link, you'll be redirected to a notice. :)</h3>
    </div>
</body>
</html>
